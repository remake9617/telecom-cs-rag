# =====================================================================
# CI 门禁（路6 / B1，闭环 DEF-053）
# 只跑编译与静态门禁，不跑需要密钥的集成测试（私有仓库 D19，CI 中绝不出现任何密钥；
# 模型 Key / 数据库密码等只存在开发者本机 .env，不入库、不进 CI Secrets）
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build (Maven 10 modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package (skip tests, per DEF-027 测试补齐前口径)
        run: mvn -B clean package -DskipTests

  frontend:
    name: Frontend gate (tsc + build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run lint
