server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  config:
    import:
      # 读取项目根 .env（API Key、VM 中间件地址）；optional 表示文件不存在也不报错
      # 同时尝试当前目录与上级目录，兼容工作目录为项目根或 cs-bootstrap 两种情况
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: cs-server

  # ===== Elasticsearch（VM 内，承载向量 kNN + BM25 + RRF 混合检索）=====
  # ES_URIS 指向 VM 地址；本地默认 localhost:9200（若中间件与后端同机）
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    connection-timeout: 30s
    socket-timeout: 30s

  # ===== MySQL 业务库（VM 内，宿主端口 13306）=====
  datasource:
    url: "jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13306}/${MYSQL_DATABASE:cs_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    password: ${MYSQL_ROOT_PASSWORD:cs_root_123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== Redis（VM 内，会话记忆/限流/缓存，宿主端口 16379）=====
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      timeout: 5s

  ai:
    # ===== 指定各能力的模型 provider（多 starter 共存时避免 bean 冲突）=====
    # Chat 用 dashscope(qwen-plus)；Embedding 用 openai 兼容(硅基流动 bge-m3)
    model:
      chat: dashscope
      embedding: openai
    # ===== Spring AI 向量存储（ES）：chunk 索引，bge-m3 = 1024 维，cosine =====
    vectorstore:
      elasticsearch:
        # 关闭自动建索引：改用 deploy/elasticsearch/es-chunk-mapping.json 手动建（含 IK 中文分词）
        initialize-schema: false
        index-name: cs_knowledge_chunk
        dimensions: 1024
        similarity: cosine

    # ===== 阿里百炼 DashScope：Chat 主力 qwen-plus（API Key 走环境变量，绝不入库 D19）=====
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7

    # ===== 硅基流动：Embedding(bge-m3) / Rerank(bge-reranker-v2-m3)，走 OpenAI 兼容协议 =====
    # base-url 不含 /v1（Spring AI 默认 embeddings-path=/v1/embeddings 会自动拼接）
    # Rerank 的精确接入方式于 M1 检索实现时最终确认
    openai:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn}
      embedding:
        options:
          model: BAAI/bge-m3

# ===== 日志 =====
logging:
  level:
    root: INFO
    com.cs: DEBUG
    org.springframework.ai: INFO

# ===== MyBatis-Plus =====
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 表 snake_case ↔ 实体 camelCase
  global-config:
    banner: false
    db-config:
      id-type: auto                      # 主键自增（对齐 schema.sql 的 AUTO_INCREMENT）

# ===== 认证（M3：Spring Security + JWT，D17）=====
# JWT 秘钥走环境变量 JWT_SECRET（绝不能入库）；HS256 要求 >= 32 字节
# 弱默认值兜底仅为本地开发能启动而保留：启动时的强校验由 ConfigValidation（DEF-030 fail-fast）负责
cs:
  jwt:
    secret: ${JWT_SECRET:dev-only-cs-server-jwt-secret-key-change-me-in-prod}
    expire-hours: 24                     # token 有效期（小时）
  # 默认管理员初始密码（仅首次启动播种时生效，公网部署前务必改）
  admin:
    default-password: ${ADMIN_DEFAULT_PASSWORD:admin123}
  # ===== 配置 fail-fast 安全闸开关（DEF-030，路6）=====
  # false = 本地宽松模式：缺配置/弱默认值只打 WARN 不终止
  # true  = 严格模式：发现弱配置直接拒绝启动（公网/生产部署必须置 true；激活 prod/public profile 也会自动严格）
  strict-config: ${CS_STRICT_CONFIG:false}

# ===== 阶段二预留配置区块（由路6 统一写入；2026-09-06 已落路7 熔断降级键）=====
# 全部键与 cs-infra-ai AiResilienceProperties 的代码默认值一致（写入目的是可运维性而非功能必需）
# 路8 实测确认无需新增配置键；Wave 2 路10 新增 cs.ratelimit 块（见下方独立区块）
  ai:
    resilience:
      enabled: true                        # 总开关：false 时 failover 链收缩为仅主供应商（熔断/超时仍生效）
      failover-enabled: true               # 多供应商 failover 开关：false 时只用主供应商
      call-timeout-ms: 30000               # 同步调用整体超时（覆盖首包+全部 token 生成）
      connect-timeout-ms: 5000             # TCP 建连超时：连不上快速切下一供应商
      first-token-timeout-ms: 15000        # 流式首包探测阈值：超时判不健康并 failover（流式唯一可靠切换时机）
      retry:
        max-attempts: 3                    # 同一供应商最大尝试次数（含首次）；流式不同供应商重试，直接切下一家
        backoff-base-ms: 500               # 指数退避基数：第 n 次重试等 base * 2^(n-1)
        backoff-max-ms: 2000               # 单次退避上限
      circuit:
        window-size: 10                    # 滑动窗口大小（最近 N 次调用样本）
        min-calls: 5                       # 最小样本数：不足时不判失败率（避免冷启动误熔断）
        failure-rate-threshold: 0.5        # 失败率阈值（0~1）：窗口内失败率 >= 该值则 OPEN
        open-duration-ms: 30000            # OPEN 持续时长，到期转 HALF_OPEN 放行试探
        half-open-max-trials: 3            # HALF_OPEN 并发试探许可数
        half-open-success-threshold: 2     # HALF_OPEN → CLOSED 所需试探成功数
      # ===== 备用供应商矩阵（OpenAI 兼容；api-key 一律 ${XXX:} 占位，绝不写真实值）=====
      # apiKey 为空则该供应商自动跳过注册（failover 链缩短而非报错）
      # chatPath 为各供应商 OpenAI 兼容路径，为代码内 final 默认值（不可 yml 覆盖）：
      #   siliconflow=/v1/chat/completions  zhipu=/v4/chat/completions  deepseek=/v1/chat/completions
      siliconflow:
        base-url: https://api.siliconflow.cn
        api-key: ${SILICONFLOW_API_KEY:}
        model: Qwen/Qwen2.5-7B-Instruct
      zhipu:
        base-url: https://open.bigmodel.cn/api/paas
        api-key: ${ZHIPU_API_KEY:}
        model: glm-4-flash
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-chat

  # ===== 限流（阶段二批次 0 路10：拒绝式 + Redis Lua 滑动窗口，按 userId+端点 维度）=====
  # 首要保护对象是流式问答：每次调用都消耗付费模型额度，是最易被刷、最该限的端点。
  # 阈值依据：人工客服场景单用户正常连续提问远低于 10 次/分钟；10/min 足以覆盖真实使用、
  # 又能挡住脚本刷量。覆盖方式：在下方 rules 里按注解 name 覆盖（不配置则用注解默认值）。
  ratelimit:
    enabled: true                         # 总开关：false 时所有 @RateLimit 直通（压测/联调用）
    rules:
      qa-chat-stream:                     # 对应 @RateLimit(name = "qa-chat-stream")
        window-seconds: 60                # 滑动窗口长度（秒）
        max-requests: 10                  # 窗口内每用户最大请求数，超限返回 SSE error(1005)

# ===== 说明 =====
# 1) 本文件为 M0 骨架基础配置；M1 补 ES/MySQL、M2 补 Redis/会话记忆、M3 补 MyBatis-Plus 分页与 JWT 认证。
# 2) 所有密钥走环境变量：AI_DASHSCOPE_API_KEY、SILICONFLOW_API_KEY、JWT_SECRET，切勿硬编码或提交入库。
# 3) 编译验证（mvn clean compile）不需要中间件；启动验证需 VM 内 MySQL/ES/Redis 就绪 + 填入 API Key。
# 4) 认证放行清单（SecurityConfig）：/api/auth/register、/api/auth/login、/api/health/**；其余 /api/** 需 Bearer token（含 SSE）
