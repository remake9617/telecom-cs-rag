# =====================================================================
# 前端静态资源 + API 同源反代（路6 / B1，闭环 DEF-054）
# 为什么同源反代：后端全仓无 CORS 配置，跨源直连会被预检拦死（DEF-054）；
# 前端与 API 同源后浏览器视角无跨域，axios 与 SSE 都能干净透传。
# =====================================================================

server {
    listen 80;
    server_name _;

    # 文档上传（Tika 解析 md/pdf/docx）放开体积限制，否则被 nginx 拦成 413
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # 带 content hash 的静态资源：长缓存 + immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口页不缓存：发版后用户第一时间拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA history 路由：刷新 /chat/12 等深链接回退 index.html，否则 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== API 反代（compose 服务名 backend；容器网络内不是 localhost）=====
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 关键配置（DEF：漏了这里，流式打字机效果完全失效）----
        # 不关 buffering 时 nginx 会攒满缓冲区才下发，SSE 事件变成最后一次性吐出
        proxy_buffering off;
        proxy_cache off;
        # SSE 长连接不能带 keep-alive 的 Connection 头
        proxy_set_header Connection "";
        # 后端 SseEmitter 超时 180s，nginx read timeout 必须比它长
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
