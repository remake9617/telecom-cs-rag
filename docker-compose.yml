# =====================================================================
# 电信运营商智能客服系统 —— 全栈编排（路6 / B1，闭环 DEF-052）
# 在 Ubuntu VM 内执行：docker compose up -d --build
#
# 【项目名 = 数据卷前缀，改名等于换库（P1 坑，勿动）】
#   下方 name: telecom-cs-rag 是阶段一建库时的 Compose 项目名，决定了数据卷前缀
#   （telecom-cs-rag_mysql-data 等）。改它 = 换一套全新空卷（阶段一数据会被静默孤立）。
#   历史教训：项目名默认取目录名，目录从 telecom-cs-rag 改为 AIBishe 后卷即被孤立；
#   显式钉死 name 后不再受目录名影响。
#
# 【两套拓扑的区别，改配置前必读】
#   拓扑 A（本地开发）：后端跑 Windows、中间件跑 VM —— .env 里 MYSQL_HOST/ES_URIS/REDIS_HOST
#     填 VM IP(192.168.25.129)，宿主端口 13306/9200/16379。不要改 .env！
#   拓扑 B（全栈容器化，本文件）：backend 与中间件同在 compose 网络 —— backend.environment
#     里显式覆盖为服务名 mysql/elasticsearch/redis + 容器内端口 3306/9200/6379。
# =====================================================================
name: telecom-cs-rag

services:
  mysql:
    image: mysql:8.4
    container_name: cs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cs_root_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cs_db}
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行初始化脚本（建表 schema 放 ./sql/init/*.sql）
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-cs_root_123}"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    # 自定义镜像：ES 8.18.8 + IK 中文分词插件（见 deploy/elasticsearch/Dockerfile）
    # 版本与 Spring AI 1.1.2 传递的 elasticsearch-java client(8.18.8) 对齐
    build:
      context: ./deploy/elasticsearch
      dockerfile: Dockerfile
    image: cs-elasticsearch:8.18.8-ik
    container_name: cs-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # 8G VM：ES heap 限 1G（不超过物理内存一半，留余量给 MySQL/Redis/系统）
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cs-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ===================================================================
  # ES 索引初始化（一次性任务，跑完即退出）：闭环 DEF-052「换机必须人工记得跑 init-index.sh」
  # 复用上面已构建的 ES 镜像（自带 curl/bash），幂等：索引已存在则脚本自动跳过
  # ===================================================================
  es-init:
    image: cs-elasticsearch:8.18.8-ik
    container_name: cs-es-init
    restart: "no"
    entrypoint:
      - bash
      - -c
      # 带重试：ES healthcheck 刚过时索引写入偶发未就绪，失败重试最多 30 次 x 5s
      - for i in $$(seq 1 30); do bash /scripts/init-index.sh && exit 0; echo "[es-init] retry $$i"; sleep 5; done; exit 1
    environment:
      ES_HOST: http://elasticsearch:9200   # compose 网络内服务名（不是 VM IP）
    volumes:
      - ./deploy/elasticsearch:/scripts:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  # ===================================================================
  # 后端（路6 / B1）：多阶段构建产物，密钥经 env_file 运行期注入，绝不进镜像
  # ===================================================================
  backend:
    build:
      context: .                        # 仓库根目录（Maven 多模块从根 pom 聚合）
      dockerfile: deploy/backend/Dockerfile
    image: cs-backend:latest
    container_name: cs-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # --- 拓扑 B 覆盖：容器网络内用服务名 + 容器内端口（不是 .env 里的 VM IP/宿主映射端口）---
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      ES_URIS: http://elasticsearch:9200
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # --- 时区双保险：只设 TZ 对 JVM 不够，必须同时 -Duser.timezone，
      #     否则时间字段「格式对但值差 8 小时」（契约要求东八区）---
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx768m -Duser.timezone=Asia/Shanghai"
      # --- B5 配置 fail-fast（DEF-030）：默认不拦、由 .env 一键可开 ---
      # 强烈建议：VM/生产环境在 .env 里置 CS_STRICT_CONFIG=true 开启严格模式。
      # 若开启后启动失败并打印「配置安全闸」清单，说明 .env 里有弱配置，
      # 按清单逐项改即可（清单只列键名，绝不回显密钥值）；改完 docker compose up -d 重试。
      CS_STRICT_CONFIG: ${CS_STRICT_CONFIG:-false}
    # 不映射 8080 到宿主：避免与本地开发后端抢端口，对外统一走 nginx(80) 同源入口
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      es-init:
        condition: service_completed_successfully
    healthcheck:
      # A 轮新增的无认证、不发起模型调用的存活探针，正是为此准备
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ===================================================================
  # 前端（路6 / B1）：nginx 同源反代，全站唯一公网入口
  # ===================================================================
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend/Dockerfile
    image: cs-frontend:latest
    container_name: cs-frontend
    restart: unless-stopped
    ports:
      - "8088:80"      # 用户拍板：宿主 80 可能被占用，改用 8088；访问地址 http://<ip>:8088
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  es-data:
  redis-data:

# 【MTU 修复（待 VM 实测确认后生效）】
# 症状：容器出网到模型供应商间歇性 Connection reset（小探针包成功、大请求体失败），
# 典型原因是宿主出口链路（PPPoE/NAT）MTU < 1500 且 ICMP 分片_needed 被吞，大包黑洞。
# 显式把 compose 网络降到 1400 规避；若 VM 实测确认无 MTU 问题，可整段删除（无副作用）。
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
